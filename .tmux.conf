# Establish the prefixes
set -g prefix ·
bind-key · send-prefix
unbind-key C-b

# Use 'r' to reload the configuration
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded!"

set -g base-index 1
set -g renumber-windows on

# splits vertically (left/right) with shift+3
bind-key '#' split-window -h
unbind %
# bind-key '"' split-window -v # splits horizontally (top/bottom)
# This is already the default but " is located as shift+2

# Use a fast chaging tiles with Alt + arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable commands using the mouse (scroll, menu, etc)
set -g mouse on

# Do not rename windows
set-option -g allow-rename off
# set window name with bind ','

# plugins instalation. Use ¬ + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-ressurect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 1. Macro check: Returns true if the active application matches Emacs or Emacsclient
is_emacs="tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\\/)g?(view|emacs?)(diff)?$'"

# 2. Contextual scrolling for Lines (Ctrl+Shift+Up/Down)
bind-key -n C-S-Up if-shell "$is_emacs" "send-keys C-S-Up" "copy-mode \; send-keys -X scroll-down"
bind-key -n C-S-Down if-shell "$is_emacs" "send-keys C-S-Down" "copy-mode \; send-keys -X scroll-down \; if-shell -F '#{scroll_position}' '' 'send-keys -X cancel'"

# 3. Contextual scrolling for Pages (Shift+PageUp/Down)
bind-key -n S-PageUp if-shell "$is_emacs" "send-keys S-PageUp" "copy-mode \; send-keys -X page-up"
bind-key -n S-PageDown if-shell "$is_emacs" "send-keys S-PageDown" "copy-mode \; send-keys -X page-down"

# 4. Smooth exiting context hook (for when you scroll in normal shell buffers)
bind-key -T copy-mode Down send-keys -X scroll-down \; if-shell -F "#{scroll_position}" "" "send-keys -X cancel"

# 2. WINDOW NAVIGATION (Ctrl+PageUp/PageDown to switch tabs)
bind-key -n C-PageUp previous-window
bind-key -n C-PageDown next-window

# 3. WINDOW REORDERING (Ctrl+Shift+PageUp/PageDown to move tab position)
bind-key -n C-S-PageUp swap-window -t -1 \; previous-window
bind-key -n C-S-PageDown swap-window -t +1 \; next-window

set -gq allow-passthrough on

set -g default-terminal "screen-256color"

# Initialize TMUX plugin manager (keep this line at the end of the .tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'